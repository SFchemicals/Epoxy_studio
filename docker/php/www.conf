[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE}
pm.max_spare_servers = ${FPM_MAX_SPARE}
clear_env = no
catch_workers_output = yes
pm.max_requests = 500
request_terminate_timeout = 600
