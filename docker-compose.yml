name: epoxy

# Memory budget, tuned for an 8 GB host (t4g.large). Limits are caps, not
# reservations; the host also needs 2-4 GB swap for compile/deploy spikes.
#   php 2.5G | cron 1.5G | opensearch 1.6G | db 1.5G | redis 768M | rabbitmq 512M | caddy 128M
x-php-env: &php-env
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-2G}
  PHP_OPCACHE_MEMORY: ${PHP_OPCACHE_MEMORY:-256}
  PHP_OPCACHE_VALIDATE: ${PHP_OPCACHE_VALIDATE:-1}
  FPM_MAX_CHILDREN: ${FPM_MAX_CHILDREN:-8}
  FPM_START_SERVERS: ${FPM_START_SERVERS:-2}
  FPM_MIN_SPARE: ${FPM_MIN_SPARE:-1}
  FPM_MAX_SPARE: ${FPM_MAX_SPARE:-4}

x-app-volumes: &app-volumes
  - ./:/var/www/html
  # Media lives on the host (default ./pub/media); override with MEDIA_PATH in .env
  - ${MEDIA_PATH:-./pub/media}:/var/www/html/pub/media

services:
  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: epoxy-php:8.5
    restart: unless-stopped
    volumes: *app-volumes
    mem_limit: ${PHP_MEM_LIMIT:-2560m}
    environment:
      <<: *php-env
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # One-shot: installs Magento if app/etc/env.php is missing, otherwise syncs
  # base URL, admin path and admin user from .env, then exits.
  setup:
    image: epoxy-php:8.5
    restart: "no"
    volumes: *app-volumes
    environment:
      <<: *php-env
      XDEBUG_MODE: "off"
      SITE_DOMAIN: ${SITE_DOMAIN:-epoxy.local}
      ADMIN_FRONTNAME: ${ADMIN_FRONTNAME:-admin}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME:-Admin}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME:-User}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAGENTO_SYNC_ON_UP: ${MAGENTO_SYNC_ON_UP:-1}
      MAGENTO_CRYPT_KEY: ${MAGENTO_CRYPT_KEY:-}
      DB_NAME: ${DB_NAME:-magento}
      DB_USER: ${DB_USER:-magento}
      DB_PASSWORD: ${DB_PASSWORD:-magento}
      RABBITMQ_USER: ${RABBITMQ_USER:-magento}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-magento}
    command: ["bash", "docker/php/setup.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  cron:
    image: epoxy-php:8.5
    restart: unless-stopped
    volumes: *app-volumes
    mem_limit: ${CRON_MEM_LIMIT:-1536m}
    environment:
      <<: *php-env
      XDEBUG_MODE: "off"
    # Runs Magento cron every minute (equivalent to crontab "* * * * *")
    command: >
      sh -c 'while true; do
        php bin/magento cron:run 2>&1 | grep -v "Ran jobs by schedule";
        sleep 60;
      done'
    depends_on:
      php:
        condition: service_started
      setup:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/var/www/html:ro
      - ${MEDIA_PATH:-./pub/media}:/var/www/html/pub/media:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-epoxy.local}
      CADDY_TLS: ${CADDY_TLS:-internal}
    depends_on:
      - php

  db:
    image: mariadb:12.3
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-1536m}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-magento}
      MARIADB_USER: ${DB_USER:-magento}
      MARIADB_PASSWORD: ${DB_PASSWORD:-magento}
    command: >-
      --max_allowed_packet=64M
      --optimizer_switch=rowid_filter=off
      --optimizer_use_condition_selectivity=1
      --innodb_buffer_pool_size=${DB_BUFFER_POOL:-1G}
      --innodb_log_file_size=256M
      --innodb_flush_log_at_trx_commit=2
      --innodb_flush_method=O_DIRECT
      --max_connections=100
      --tmp_table_size=64M
      --max_heap_table_size=64M
      --performance_schema=OFF
      --skip-name-resolve
    # Host-only: reach it via SSH tunnel, never from the internet
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    mem_limit: 768m
    # Cache (db0), full-page cache (db1) and sessions (db2). allkeys-lru drops
    # the least-recently-used keys when full instead of failing writes; active
    # sessions are recently used, so they survive.
    command: >-
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-640mb}
      --maxmemory-policy allkeys-lru
      --save 300 100
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    # RabbitMQ reads the cgroup limit and sets its watermark from it
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-magento}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-magento}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3
    restart: unless-stopped
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-1638m}
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
      # Small EBS volume: don't flip indices to read-only at 95% disk
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  db_data:
  redis_data:
  rabbitmq_data:
  opensearch_data:
  caddy_data:
  caddy_config:
